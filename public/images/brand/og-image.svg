<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="1200" height="630" fill="#151B24"/>
  <!-- Subtle Blueprint Architectural Grid -->
  <defs>
    <pattern id="grid" width="60" height="60" patternUnits="userSpaceOnUse">
      <path d="M 60 0 L 0 0 0 60" fill="none" stroke="#D8DCE0" stroke-width="0.5" opacity="0.08"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" />

  <!-- Accent Gold Border Hairline -->
  <rect x="40" y="40" width="1120" height="550" fill="none" stroke="#B99A65" stroke-width="1" opacity="0.4"/>

  <!-- TE Monogram -->
  <g transform="skewX(-14) translate(140, 160)">
    <polygon points="10,24 160,24 154,54 10,54" fill="#F5F5F2"/>
    <polygon points="56,54 94,54 94,180 56,180" fill="#F5F5F2"/>
    <polygon points="106,68 180,68 166,104 134,104 134,120 172,120 158,180 106,180" fill="#B99A65"/>
    <polygon points="134,104 166,104 160,120 134,120" fill="#151B24"/>
  </g>

  <!-- Typography Content -->
  <text x="380" y="240" fill="#B99A65" font-family="'Barlow Condensed', sans-serif" font-weight="600" font-size="20" letter-spacing="5">ALUMINIUM &amp; GLASS SOLUTIONS · PUNE</text>
  <text x="380" y="320" fill="#F5F5F2" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="64" letter-spacing="2">SPACES. CRAFTED TO PERFECTION.</text>
  <text x="380" y="380" fill="#D8DCE0" font-family="Inter, sans-serif" font-weight="400" font-size="22" opacity="0.85">Precision Architectural Systems for Luxury Homes &amp; Commercial Spaces</text>

  <!-- Footer Tagline -->
  <text x="80" y="540" fill="#D8DCE0" font-family="Inter, sans-serif" font-weight="500" font-size="14" letter-spacing="3" opacity="0.6">TIWARIENTERPRISES.IN · PUNE, MAHARASHTRA</text>
  <text x="1080" y="540" text-anchor="end" fill="#B99A65" font-family="'Barlow Condensed', sans-serif" font-weight="700" font-size="16" letter-spacing="3">6063-T6 ALLOY · BIS SAFETY GLASS</text>
</svg>

